services:
    db:
        dns:
            - 8.8.8.8
        build:
            context: ./docker/postgres
        container_name: postgres_citus
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: 1111
            POSTGRES_DB: mydb
        volumes:
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
            - backups:/var/lib/postgresql/data
        command: ["postgres", "-c", "shared_preload_libraries=pg_cron"]
        restart: unless-stopped
    backend:
        build: ./backend
        ports:
            - "5000:3000"
        depends_on:
            - db
        environment:
            DATABASE_URL: postgres://postgres:1111@db:5432/mydb
    frontend:
        build: ./frontend
        ports:
            - "8000:5173"
        depends_on:
            - backend

volumes:
    backups:
